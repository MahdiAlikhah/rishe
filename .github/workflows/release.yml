name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/api_surface.py --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  rust-models:
    name: rust models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --features python,models --all-targets -- -D warnings
      - run: cargo test --locked --features models

  # MSRV gate: the default feature set and the `python` feature must build on
  # the highest `rust-version` declared by anything in that feature graph
  # (currently 1.88, via ureq -> url -> idna -> icu_normalizer). `models` has a
  # higher floor of its own (tract declares 1.91), so it is deliberately not
  # part of this job.
  #
  # The gate also pins the toolchain: raise the pin only together with
  # `rust-version` in Cargo.toml and the MSRV statement in the READMEs and
  # docs/STABILITY.md.
  msrv:
    name: msrv (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked
      - run: cargo check --locked --features python

  # Every declared feature combination must compile on its own.
  features:
    name: features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --no-default-features
      - run: cargo check --locked --features python
      - run: cargo check --locked --features models
      - run: cargo check --locked --features python,models
      - run: sudo apt-get update && sudo apt-get install -y python3-dev
      - run: cargo test --locked --features python --test py_binding_errors

  # The wheel is abi3 (cp39-abi3), so one build serves every supported CPython
  # version. Building it here once and installing the artifact everywhere else
  # keeps `python-tests`, `examples` and `pack-tests` from compiling Rust six
  # more times over.
  build-wheel:
    name: build wheel (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install maturin
      - run: maturin build --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error

  # `cuda` and `metal` are opt-in features nobody builds by default, so without
  # this job they can rot unnoticed. `metal` is Apple-only: tract declares
  # `tract-metal` under `cfg(target_vendor = "apple")`, so on Linux the feature
  # silently resolves to nothing and the check would prove nothing.
  gpu-features:
    name: gpu feature (${{ matrix.feature }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { feature: cuda, os: ubuntu-latest }
          - { feature: metal, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `check` never links, so a broken link config stayed green for these two.
      - run: cargo build --locked --features ${{ matrix.feature }}

  # A RustSec advisory in a dependency must fail the run. Like `gpu-features` it is
  # absent from `publish-pypi.needs`: an advisory in a transitive crate is not a
  # reason to block a release, but it must be visible before the next one.
  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Public docs must be warning-free: rustdoc warnings are errors here.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --features python,models
        env:
          RUSTDOCFLAGS: "-D warnings"
      # 1.0.2 shipped a 689-byte LICENSE-APACHE that was only the appendix
      # notice, which no test could see; the size floor is the check for that.
      - name: License files carry the full text
        run: |
          [ "$(wc -c < LICENSE-APACHE)" -ge 10000 ] || {
            echo "LICENSE-APACHE is truncated: $(wc -c < LICENSE-APACHE) bytes" >&2
            exit 1; }
          [ "$(wc -c < LICENSE-MIT)" -ge 900 ] || {
            echo "LICENSE-MIT is truncated: $(wc -c < LICENSE-MIT) bytes" >&2
            exit 1; }
      # A tag whose CHANGELOG section is missing cannot get release notes, and a
      # published version can never be re-uploaded, so both are checked here —
      # before anything reaches a registry — rather than in publish-release.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          [ "$crate" = "$version" ] || {
            echo "tag $version != Cargo.toml $crate" >&2; exit 1; }
          python scripts/release_notes.py --selftest
          python scripts/release_notes.py "$version" > /dev/null

  python-tests:
    name: python tests (${{ matrix.python }})
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One job per supported CPython version: README.md and docs/STABILITY.md
        # name 3.9 – 3.14, so every one of them is built and tested here.
        include:
          # Python 3.9 is no longer in the ubuntu-latest image (Ubuntu 26 from
          # late 2026), so the oldest supported interpreter runs on 22.04.
          - { python: "3.9", os: ubuntu-22.04 }
          - { python: "3.10", os: ubuntu-latest }
          - { python: "3.11", os: ubuntu-latest }
          - { python: "3.12", os: ubuntu-latest }
          - { python: "3.13", os: ubuntu-latest }
          - { python: "3.14", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s python/tests -v
      - run: python scripts/benchmark_golden.py

  # The matrix above runs on Linux only, so a Windows-only break (paths, line
  # endings, `os.replace` on a locked file) shipped green. This builds the
  # Windows wheel and runs the same suite on it. The wheel is abi3, so one
  # Python version is enough.
  python-tests-windows:
    name: python tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install maturin
      - run: maturin build --release --locked --out dist
      - run: python -m pip install --no-deps (Get-ChildItem dist/*.whl)
      - run: python -m unittest discover -s python/tests -v
      - run: python scripts/benchmark_golden.py

  # Examples that need neither a model pack nor the network. The list is
  # explicit on purpose: examples/embeddings.py loads rishe-embed-fa-300-v2 from
  # the hub cache, so it must not be picked up by a glob here.
  examples:
    name: examples
    needs: build-wheel
    runs-on: ubuntu-latest
    env:
      # The examples print Persian text; pin stdout to UTF-8 instead of relying
      # on the runner's locale.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: python scripts/check_docs_examples.py
      - run: python examples/basic.py
      - run: python examples/masking_keywords.py

  # The suite above skips 12 tests: everything that runs ONNX inference, plus the
  # real embedding pack. They are gated on env vars, so nothing exercised those
  # paths in CI and a broken pack could ship green. This runs them for real.
  # Tag-only on purpose: it downloads ~225 MB, which is not worth paying on every
  # pull request, but a release must not go out with inference never tested.
  pack-tests:
    name: pack tests
    needs: build-wheel
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rishe
          key: rishe-packs-${{ hashFiles('python/rishe/hub.py') }}
      - run: python -m pip install --no-deps dist/*.whl
      # Exports the three variables the skipped tests look for. The variables are
      # then checked: a failed pull would leave them empty, the tests would skip
      # again, and this job would pass green without testing anything. The pull
      # writes to a file first because `eval "$(...)"` hides a nonzero exit.
      - run: |
          set -euo pipefail
          python scripts/pull_test_packs.py > "$RUNNER_TEMP/env.sh"
          . "$RUNNER_TEMP/env.sh"
          for name in RISHE_TEST_PACK RISHE_TEST_DEPPARSE_PACK RISHE_TEST_EMBEDDINGS_PACK; do
            [ -n "${!name}" ] || { echo "$name is unset: the pull failed" >&2; exit 1; }
          done
          python -m unittest discover -s python/tests -v

  wheels:
    name: wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, manylinux: auto, container: "", args: "--release --out dist" }
          # glibc ARM: without this row every Raspberry Pi / Graviton user falls
          # back to the sdist, which needs a Rust toolchain. `container: auto`
          # asks maturin to cross-compile inside a manylinux image.
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, manylinux: auto, container: "auto", args: "--release --out dist" }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, manylinux: musllinux_1_2, container: "off", args: "--release --out dist --zig" }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, manylinux: musllinux_1_2, container: "off", args: "--release --out dist --zig" }
          - { target: x86_64-apple-darwin, os: macos-15, manylinux: "", container: "", args: "--release --out dist" }
          - { target: aarch64-apple-darwin, os: macos-15, manylinux: "", container: "", args: "--release --out dist" }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, manylinux: "", container: "", args: "--release --out dist" }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
          args: ${{ matrix.args }} --locked
          rust-toolchain: stable
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # Every wheel is built on its own runner and then never opened, so a broken
  # one could publish green. Each row installs the artifact built for its own
  # platform and calls into it. The musllinux and aarch64-musl wheels are not
  # covered here: running them needs an emulated Alpine container, where the
  # `actions/download-artifact` node action is unavailable.
  wheel-smoke:
    name: wheel smoke (${{ matrix.label }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64, os: ubuntu-latest, pattern: "*-manylinux*_x86_64.whl" }
          - { label: macos-arm64, os: macos-15, pattern: "*-macosx*_arm64.whl" }
          - { label: windows-x86_64, os: windows-latest, pattern: "*-win_amd64.whl" }
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only the matrix artifacts: `build-wheel` uploads a second linux wheel
          # with the same file name, and it is not a shipping artifact.
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `bash` on every runner, so the glob expands the same way on Windows.
      - shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls dist/${{ matrix.pattern }})
          test -n "$wheel"
          python -m pip install --no-deps "$wheel"
          python -c "import rishe; print(rishe.normalize('مي كنم')); print(rishe.process('سلام دنیا'))"

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Tag-triggered releases. PyPI uses trusted publishing (OIDC): register this
  # repo + workflow "release.yml" as a trusted publisher on pypi.org first.
  publish-pypi:
    # Both publishers wait for exactly the same jobs: the wheel ships with
    # `models` and the Windows wheel is a shipping artifact, so neither may
    # publish before those pass. `docs` carries the tag-gated CHANGELOG check.
    # `gpu-features` is deliberately absent: cuda and metal are not in the
    # published wheel, so a GPU break must not block a release — it still fails
    # the run loudly.
    needs: [rust, rust-models, msrv, features, python-tests, python-tests-windows, examples, wheels, wheel-smoke, sdist, docs, pack-tests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      # Only what a gate opened: the matrix wheels plus the sdist. Downloading
      # every artifact merged `build-wheel`'s wheel over the matrix one of the
      # same name, and `skip-existing` cannot correct a wrong upload.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-crate:
    needs: [rust, rust-models, msrv, features, python-tests, python-tests-windows, examples, wheels, wheel-smoke, sdist, docs, pack-tests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check crates.io for existing version
        id: crates
        shell: bash
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          status=$(curl -s -o /dev/null -w "%{http_code}" -A "rishe-release-check (https://github.com/MahdiAlikhah/rishe)" "https://crates.io/api/v1/crates/rishe/$version")
          if [ "$status" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "rishe $version is already on crates.io; skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.crates.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # The GitHub Release is a separate surface from the tag and the registries:
  # a green publish leaves it missing unless something creates it. Notes come
  # from the CHANGELOG section for this version, so the release page and the
  # file cannot drift.
  publish-release:
    needs: [publish-pypi, publish-crate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check GitHub for an existing release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME already has a release; skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.release.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/release_notes.py "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Rishe $version" \
            --notes-file notes.md
