name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The fuzz harness and the retrieval metrics ship as tools, so a change that
  # silently makes them stop detecting defects must fail here rather than pass
  # green while testing nothing. Both selftests feed known-bad inputs through the
  # real detectors and need no built binary or corpus, so they cost seconds.
  harness-selftest:
    name: fuzz harness selftest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fuzz_surfaces.py --selftest
      - run: pip install numpy && python scripts/benchmark_retrieval.py --selftest

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/api_surface.py --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  rust-models:
    name: rust models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --features python,models --all-targets -- -D warnings
      - run: cargo test --locked --features models

  # MSRV gate: the default feature set and the `python` feature must build on
  # the highest `rust-version` declared by anything in that feature graph
  # (currently 1.88, via ureq -> url -> idna -> icu_normalizer). `models` has a
  # higher floor of its own (tract declares 1.91), so it is deliberately not
  # part of this job.
  #
  # The gate also pins the toolchain: raise the pin only together with
  # `rust-version` in Cargo.toml and the MSRV statement in the READMEs and
  # docs/STABILITY.md.
  msrv:
    name: msrv (1.88.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked
      - run: cargo check --locked --features python

  # `models` pulls `tract`, which declares rust-version 1.91, so the `models`
  # feature has a higher floor than the crate's own 1.88. That floor was
  # documented in `docs/STABILITY.md` and `README.fa.md` claimed CI re-checked it
  # on every push, but no job did.
  msrv-models:
    name: msrv models (1.91.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --features models
      - run: cargo check --locked --features python,models

  # Every declared feature combination must compile on its own.
  features:
    name: features
    runs-on: ubuntu-24.04
    # Pin the interpreter: rust-cache restores the crate's build-script output
    # across images, and a cached pyo3 config pointing at Python 3.14 (the
    # runner image before the 24.04 pin) made the linker ask for a libpython the
    # image no longer has. Naming it re-runs pyo3's detection here.
    env:
      PYO3_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --no-default-features
      - run: cargo check --locked --features python
      - run: cargo check --locked --features models
      - run: cargo check --locked --features python,models
      # `--no-default-features` was only `check`ed; the tests that compile under
      # it were never run, so a `#[cfg(not(feature = "hub"))]` path could rot.
      - run: cargo test --locked --no-default-features --lib
      - run: sudo apt-get update && sudo apt-get install -y python3-dev
      - run: cargo test --locked --features python --test py_binding_errors

  # The wheel is abi3 (cp39-abi3), so one build serves every supported CPython
  # version. Building it here once and installing the artifact everywhere else
  # keeps `python-tests`, `examples` and `pack-tests` from compiling Rust six
  # more times over.
  build-wheel:
    name: build wheel (linux x86_64)
    # The oldest supported glibc (22.04, 2.35) on purpose: this plain
    # `linux_x86_64` wheel is installed by every Linux test job, so building it
    # on a newer image makes the old interpreters fail with a missing GLIBC
    # symbol. The published manylinux wheel comes from the `wheels` matrix.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install maturin
      - run: maturin build --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error

  # `cuda` and `metal` are opt-in features nobody builds by default, so without
  # this job they can rot unnoticed. `metal` is Apple-only: tract declares
  # `tract-metal` under `cfg(target_vendor = "apple")`, so on Linux the feature
  # silently resolves to nothing and the check would prove nothing.
  gpu-features:
    name: gpu feature (${{ matrix.feature }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { feature: cuda, os: ubuntu-24.04 }
          # Intel on purpose: GitHub's arm64 macOS hosted runners are
          # capacity-constrained ("not acquired by Runner ... even after multiple
          # attempts") and cancelled this job twice. `metal` compiles on x64 too;
          # a cancelled runner acquisition cannot be retried by `continue-on-error`.
          - { feature: metal, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `check` never links, so a broken link config stayed green for these two.
      - run: cargo build --locked --features ${{ matrix.feature }}

  # A RustSec advisory in a dependency must be visible before the next release.
  # It is deliberately not a publishing gate: an advisory in a transitive crate
  # is not a reason to hold back a patch. `cargo audit` runs directly instead of
  # `rustsec/audit-check`, whose failing "Security audit" check run appeared as a
  # red job inside an otherwise passing run; `continue-on-error` on the step keeps
  # known advisories reported as a warning without painting the run red.
  audit:
    name: dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
        continue-on-error: true

  # Public docs must be warning-free: rustdoc warnings are errors here.
  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --features python,models
        env:
          RUSTDOCFLAGS: "-D warnings"
      # 1.0.2 shipped a 689-byte LICENSE-APACHE that was only the appendix
      # notice, which no test could see; the size floor is the check for that.
      - name: License files carry the full text
        run: |
          [ "$(wc -c < LICENSE-APACHE)" -ge 10000 ] || {
            echo "LICENSE-APACHE is truncated: $(wc -c < LICENSE-APACHE) bytes" >&2
            exit 1; }
          [ "$(wc -c < LICENSE-MIT)" -ge 900 ] || {
            echo "LICENSE-MIT is truncated: $(wc -c < LICENSE-MIT) bytes" >&2
            exit 1; }
      # A tag whose CHANGELOG section is missing cannot get release notes, and a
      # published version can never be re-uploaded, so both are checked here —
      # before anything reaches a registry — rather than in publish-release.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          [ "$crate" = "$version" ] || {
            echo "tag $version != Cargo.toml $crate" >&2; exit 1; }
          python scripts/release_notes.py --selftest
          python scripts/release_notes.py "$version" > /dev/null

  python-tests:
    name: python tests (${{ matrix.python }})
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One job per supported CPython version: README.md and docs/STABILITY.md
        # name 3.9 – 3.14, so every one of them is built and tested here.
        include:
          # Python 3.9 is not in the current runner image (Ubuntu 26 from late
          # 2026), so the oldest supported interpreter runs on 22.04: its glibc
          # is also the floor the shared wheel is built against.
          - { python: "3.9", os: ubuntu-22.04 }
          - { python: "3.10", os: ubuntu-24.04 }
          - { python: "3.11", os: ubuntu-24.04 }
          - { python: "3.12", os: ubuntu-24.04 }
          - { python: "3.13", os: ubuntu-24.04 }
          - { python: "3.14", os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s python/tests -v
      - run: python scripts/benchmark_golden.py

  # The matrix above runs on Linux only, so a Windows-only break (paths, line
  # endings, `os.replace` on a locked file) shipped green. This builds the
  # Windows wheel and runs the same suite on it. The wheel is abi3, so one
  # Python version is enough.
  python-tests-windows:
    name: python tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install maturin
      - run: maturin build --release --locked --out dist
      - run: python -m pip install --no-deps (Get-ChildItem dist/*.whl)
      - run: python -m unittest discover -s python/tests -v
      - run: python scripts/benchmark_golden.py

  # Examples that need neither a model pack nor the network. The list is
  # explicit on purpose: examples/embeddings.py loads rishe-embed-fa-300-v2 from
  # the hub cache, so it must not be picked up by a glob here.
  examples:
    name: examples
    needs: build-wheel
    runs-on: ubuntu-24.04
    env:
      # The examples print Persian text; pin stdout to UTF-8 instead of relying
      # on the runner's locale.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: python scripts/check_docs_examples.py
      - run: python examples/basic.py
      - run: python examples/masking_keywords.py

  # The suite above skips 12 tests: everything that runs ONNX inference, plus the
  # real embedding pack. They are gated on env vars, so nothing exercised those
  # paths in CI and a broken pack could ship green. This runs them for real.
  # Tag-only on purpose: it downloads ~225 MB, which is not worth paying on every
  # pull request, but a release must not go out with inference never tested.
  pack-tests:
    name: pack tests
    needs: build-wheel
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rishe
          # Both halves of the registry: `src/hub.rs` holds the digest and file
          # list a pack is verified against, so keying only on `hub.py` reused a
          # cache the Rust side would now reject.
          key: rishe-packs-${{ hashFiles('python/rishe/hub.py', 'src/hub.rs') }}
      - run: python -m pip install --no-deps dist/*.whl
      - uses: dtolnay/rust-toolchain@stable
      # Exports the variables the skipped tests look for, for both suites. They
      # are then checked: a failed pull would leave them empty, the tests would
      # skip again, and this job would pass green without testing anything. The
      # pull writes to a file first because `eval "$(...)"` hides a nonzero exit.
      - run: |
          set -euo pipefail
          python scripts/pull_test_packs.py > "$RUNNER_TEMP/env.sh"
          . "$RUNNER_TEMP/env.sh"
          for name in RISHE_TEST_PACK RISHE_TEST_DEPPARSE_PACK RISHE_TEST_EMBEDDINGS_PACK RISHE_DEPPARSE_PACK RISHE_EMBEDDINGS_PACK; do
            [ -n "${!name}" ] || { echo "$name is unset: the pull failed" >&2; exit 1; }
          done
          python -m unittest discover -s python/tests -v
      # The Rust suite has its own env-gated pack tests (`models.rs`,
      # `embeddings.rs`); before this they were never run in CI, only skipped.
      # Both are named `*_loaded_pack`, so one filter runs them.
      - run: |
          set -euo pipefail
          . "$RUNNER_TEMP/env.sh"
          cargo test --locked --features models --lib -- loaded_pack

  wheels:
    name: wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04, not -latest: the shared test wheel is a plain
          # `linux_x86_64` build, so it is only importable on the image family
          # that built it. `latest` began rolling to 26.04 mid-release and the
          # Python 3.9 job then failed on the newer glibc.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, manylinux: auto, container: "", args: "--release --out dist" }
          # glibc ARM: without this row every Raspberry Pi / Graviton user falls
          # back to the sdist, which needs a Rust toolchain.
          #
          # `--zig` with `container: off`, not `container: auto`: the manylinux
          # cross image's gcc does not define `__ARM_ARCH`, so ring 0.17.14 fails
          # its ARM asm with `#error "ARM assembler must define __ARM_ARCH"` and
          # this row uploaded nothing for four releases while the job stayed green.
          # Zig's clang defines it, which is why the aarch64 musl row below
          # already worked; maturin tags the result manylinux_2_17 for `auto`.
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04, manylinux: auto, container: "off", args: "--release --out dist --zig" }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, manylinux: musllinux_1_2, container: "off", args: "--release --out dist --zig" }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04, manylinux: musllinux_1_2, container: "off", args: "--release --out dist --zig" }
          # macOS: Intel runners, both rows. The arm64 macOS hosted runners are
          # capacity-constrained and one of these wheels was cancelled waiting for
          # a runner. Xcode cross-compiles the arm64 wheel from x64 (the same way
          # cibuildwheel builds universal wheels), so no arm64 runner is needed.
          - { target: x86_64-apple-darwin, os: macos-15-intel, manylinux: "", container: "", args: "--release --out dist" }
          - { target: aarch64-apple-darwin, os: macos-15-intel, manylinux: "", container: "", args: "--release --out dist" }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, manylinux: "", container: "", args: "--release --out dist" }
    steps:
      - uses: actions/checkout@v4
      # Cross-compiling the arm64 macOS wheel needs its std installed; this also
      # proves the target is available before maturin runs.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'aarch64-apple-darwin'
        with:
          targets: aarch64-apple-darwin
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
          args: ${{ matrix.args }} --locked
          rust-toolchain: stable
      # No `continue-on-error`: every row must produce its wheel. One did not for
      # four releases and only this step's `if-no-files-found` would have said so.
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # Every wheel is built on its own runner and then never opened, so a broken
  # one could publish green. Each row installs the artifact built for its own
  # platform and calls into it. The musllinux and aarch64-musl wheels are not
  # covered here: running them needs an emulated Alpine container, where the
  # `actions/download-artifact` node action is unavailable. The aarch64 glibc
  # wheel is in the same position — it compiles under zig but is not run, so
  # "the build succeeded" is all this pipeline ever proves about it. The arm64
  # macOS wheel is cross-compiled and not smoked either: its runner is the same
  # capacity-constrained arm64 pool that kept cancelling jobs, so the Intel
  # macOS wheel carries the macOS smoke instead.
  wheel-smoke:
    name: wheel smoke (${{ matrix.label }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64, os: ubuntu-24.04, pattern: "*-manylinux*_x86_64.whl" }
          - { label: macos-x86_64, os: macos-15-intel, pattern: "*-macosx*_x86_64.whl" }
          - { label: windows-x86_64, os: windows-latest, pattern: "*-win_amd64.whl" }
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only the matrix artifacts: `build-wheel` uploads a second linux wheel
          # with the same file name, and it is not a shipping artifact.
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `bash` on every runner, so the glob expands the same way on Windows.
      - shell: bash
        env:
          # The print below is Persian and the Windows console is cp1252 by
          # default: without this the smoke fails on an encoding error, not on a
          # broken wheel.
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          wheel=$(ls dist/${{ matrix.pattern }})
          test -n "$wheel"
          python -m pip install --no-deps "$wheel"
          python -c "import rishe; print(rishe.normalize('مي كنم')); print(rishe.process('سلام دنیا'))"

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      # The sdist was built and published but never installed, so a missing file
      # in the archive would only surface for the users who fall back to it.
      - run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sdist-venv"
          . "$RUNNER_TEMP/sdist-venv/bin/activate"
          pip install --upgrade pip
          pip install --no-binary :all: dist/*.tar.gz
          python -c "import rishe; print(rishe.normalize('مي كنم'))"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Tag-triggered releases. PyPI uses trusted publishing (OIDC): register this
  # repo + workflow "release.yml" as a trusted publisher on pypi.org first.
  publish-pypi:
    # Both publishers wait for exactly the same jobs: the wheel ships with
    # `models` and the Windows wheel is a shipping artifact, so neither may
    # publish before those pass. `docs` carries the tag-gated CHANGELOG check.
    # `gpu-features` is deliberately absent: cuda and metal are not in the
    # published wheel, so a GPU break must not block a release — it still fails
    # the run loudly.
    needs: [rust, rust-models, msrv, msrv-models, features, python-tests, python-tests-windows, examples, wheels, wheel-smoke, sdist, docs, pack-tests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      # Only what a gate opened: the matrix wheels plus the sdist. Downloading
      # every artifact merged `build-wheel`'s wheel over the matrix one of the
      # same name, and `skip-existing` cannot correct a wrong upload.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-crate:
    needs: [rust, rust-models, msrv, msrv-models, features, python-tests, python-tests-windows, examples, wheels, wheel-smoke, sdist, docs, pack-tests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check crates.io for existing version
        id: crates
        shell: bash
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          status=$(curl -s -o /dev/null -w "%{http_code}" -A "rishe-release-check (https://github.com/MahdiAlikhah/rishe)" "https://crates.io/api/v1/crates/rishe/$version")
          if [ "$status" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "rishe $version is already on crates.io; skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.crates.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # The GitHub Release is a separate surface from the tag and the registries:
  # a green publish leaves it missing unless something creates it. Notes come
  # from the CHANGELOG section for this version, so the release page and the
  # file cannot drift.
  publish-release:
    needs: [publish-pypi, publish-crate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check GitHub for an existing release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME already has a release; skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.release.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/release_notes.py "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Rishe $version" \
            --notes-file notes.md
