name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/api_surface.py --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  rust-models:
    name: rust models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --features models

  # MSRV gate: the default feature set and the `python` feature must build on
  # the highest `rust-version` declared by anything in that feature graph
  # (currently 1.88, via ureq -> url -> idna -> icu_normalizer). `models` has a
  # higher floor of its own (tract declares 1.91), so it is deliberately not
  # part of this job.
  #
  # The gate also pins the toolchain: raise the pin only together with
  # `rust-version` in Cargo.toml and the MSRV statement in the READMEs and
  # docs/STABILITY.md.
  msrv:
    name: msrv (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked
      - run: cargo check --locked --features python

  # Every declared feature combination must compile on its own.
  features:
    name: features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --no-default-features
      - run: cargo check --locked --features python
      - run: cargo check --locked --features models
      - run: cargo check --locked --features python,models

  # Public docs must be warning-free: rustdoc warnings are errors here.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --features python,models
        env:
          RUSTDOCFLAGS: "-D warnings"

  python-tests:
    name: python tests (${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One job per supported CPython version: README.md and docs/STABILITY.md
        # name 3.9 – 3.14, so every one of them is built and tested here.
        include:
          # Python 3.9 is no longer in the ubuntu-latest image (Ubuntu 26 from
          # late 2026), so the oldest supported interpreter runs on 22.04.
          - { python: "3.9", os: ubuntu-22.04 }
          - { python: "3.10", os: ubuntu-latest }
          - { python: "3.11", os: ubuntu-latest }
          - { python: "3.12", os: ubuntu-latest }
          - { python: "3.13", os: ubuntu-latest }
          - { python: "3.14", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install maturin
      - run: maturin build --release --out dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s python/tests -v
      - run: python scripts/benchmark_golden.py

  # Examples that need neither a model pack nor the network. The list is
  # explicit on purpose: examples/embeddings.py loads rishe-embed-fa-300-v2 from
  # the hub cache, so it must not be picked up by a glob here.
  examples:
    name: examples
    runs-on: ubuntu-latest
    env:
      # The examples print Persian text; pin stdout to UTF-8 instead of relying
      # on the runner's locale.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install maturin
      - run: maturin build --release --out dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: python scripts/check_docs_examples.py
      - run: python examples/basic.py
      - run: python examples/masking_keywords.py

  wheels:
    name: wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, manylinux: auto, container: "", args: "--release --out dist" }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, manylinux: musllinux_1_2, container: "off", args: "--release --out dist --zig" }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, manylinux: musllinux_1_2, container: "off", args: "--release --out dist --zig" }
          - { target: x86_64-apple-darwin, os: macos-15, manylinux: "", container: "", args: "--release --out dist" }
          - { target: aarch64-apple-darwin, os: macos-15, manylinux: "", container: "", args: "--release --out dist" }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, manylinux: "", container: "", args: "--release --out dist" }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
          args: ${{ matrix.args }}
          rust-toolchain: stable
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Tag-triggered releases. PyPI uses trusted publishing (OIDC): register this
  # repo + workflow "release.yml" as a trusted publisher on pypi.org first.
  publish-pypi:
    needs: [rust, python-tests, examples, wheels, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-crate:
    needs: [rust, rust-models, msrv, features, docs, examples, wheels, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check crates.io for existing version
        id: crates
        shell: bash
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          status=$(curl -s -o /dev/null -w "%{http_code}" -A "rishe-release-check (https://github.com/MahdiAlikhah/rishe)" "https://crates.io/api/v1/crates/rishe/$version")
          if [ "$status" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "rishe $version is already on crates.io; skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.crates.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
