[package]
name = "rishe"
version = "0.6.2"
edition = "2021"
rust-version = "1.75"
description = "Rishe (ریشه): High-performance Persian NLP engine in Rust — tokenization, SBD, lemmatization, ezafe detection, informal→formal normalization, stemming, spell checking, embeddings"
license = "MIT OR Apache-2.0"
readme = "README.crates.md"
keywords = ["nlp", "persian", "farsi", "tokenization", "lemmatization"]
categories = ["text-processing", "api-bindings"]
authors = ["Mahdi Alikhah <96587315+MahdiAlikhah@users.noreply.github.com>"]
repository = "https://github.com/MahdiAlikhah/rishe"
homepage = "https://github.com/MahdiAlikhah/rishe"
documentation = "https://docs.rs/rishe"
exclude = [
    ".*",
    "*.html",
    "data/corpora/*",
    "data/raw_*",
    "docs/*",
    "python/*",
    "scripts/*",
    "target/*",
]

[lib]
name = "rishe"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]
models = ["dep:tract", "dep:tokenizers", "dep:ndarray", "dep:serde_json"]

[dependencies]
aho-corasick = "1.1"
fst = "0.4"
rayon = "1.10"
pyo3 = { version = "0.22", optional = true, features = ["extension-module", "abi3-py39"] }
tract = { version = "0.23.9", optional = true, default-features = false, features = ["onnx"] }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["unstable_wasm"] }
ndarray = { version = "0.16", optional = true }
serde_json = { version = "1", optional = true }

[build-dependencies]
fst = "0.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "tier1_bench"
harness = false